[package]
name = "tidalsrc"
version = "0.1.0"
edition = "2021"
description = "Unofficial TIDAL source plugin (JSON-RPC over stdio): catalogue, sign-in and stream resolution"
license = "MIT"
repository = "https://github.com/anon7627/tidalsrc"

[[bin]]
name = "tidalsrc"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
uuid = { version = "1", features = ["v4"] }
urlencoding = "2"
base64 = "0.22"
sha2 = "0.10"
roxmltree = "0.20"

[profile.release]
lto = "thin"
codegen-units = 1
